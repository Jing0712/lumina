# The agent service holds the provider keys and the deep-search cap, so it has NO public
# service: no [http_service] block. The gateway reaches it over Fly's private network at
#   http://<this app name>.internal:8000
app = "lumina-agent-jc0930"
primary_region = "sjc"


[env]
  PORT_AGENT = "8000"
  RUNS_DIR = "/app/runs"

# performance, not shared: a shared vCPU is guaranteed only 6.25% of a core once its burst
# balance runs out, and a sustained load (the full bench: 40 asks + a 60-page PDF ingest)
# drains it. Throttled, TTFT p50 went from ~1 s to 6.7 s.
[[vm]]
  memory = "2gb"
  cpu_kind = "performance"
  cpus = 1
